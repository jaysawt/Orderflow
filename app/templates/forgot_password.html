{% extends "base.html" %}

{% block title %}Reset Password | Orderflow{% endblock %}

{% block content %}
<div class="login-card-wrapper">
    <div class="card login-card">
        <div class="card-body p-4 p-sm-4">
            
            <!-- Brand Header -->
            <div class="text-center mb-4">
                <div class="brand-logo-placeholder">
                    OF
                </div>
                <h1 class="h5 brand-title mb-1">Orderflow</h1>
                <p class="brand-subtitle mb-0">Reset Password</p>
            </div>

            <!-- Error Message Placeholder -->
            {% if error %}
            <div class="alert alert-custom-error mb-4" role="alert">
                {{ error }}
            </div>
            {% endif %}

            <!-- Reset Password Form -->
            <form action="/forgot-password" method="POST" novalidate>
                {% if csrf_token %}
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                {% endif %}

                <!-- Username Field -->
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input 
                        type="text" 
                        class="form-control" 
                        id="username" 
                        name="username" 
                        placeholder="Enter your username" 
                        required 
                        autocomplete="username"
                    >
                </div>

                <!-- New Password Field -->
                <div class="mb-4">
                    <label for="new_password" class="form-label mb-1">New Password</label>
                    <input 
                        type="password" 
                        class="form-control" 
                        id="new_password" 
                        name="new_password" 
                        placeholder="Enter new password" 
                        required 
                        autocomplete="new-password"
                    >
                </div>

                <!-- Confirm Password Field -->
                <div class="mb-4">
                    <label for="confirm_password" class="form-label mb-1">Confirm New Password</label>
                    <input 
                        type="password" 
                        class="form-control" 
                        id="confirm_password" 
                        name="confirm_password" 
                        placeholder="Confirm new password" 
                        required 
                        autocomplete="new-password"
                    >
                </div>

                <!-- Reset Password Button -->
                <button type="submit" class="btn btn-primary-accent w-100 mb-3">
                    Reset Password
                </button>

                <!-- Back to Login -->
                <div class="mt-3 d-flex justify-content-center">
                    <a href="/login" class="forgot-password-link">Back to Login</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
