{% extends "base.html" %}

{% block title %}Setup | Orderflow{% endblock %}

{% block content %}
<div class="login-card-wrapper">
    <div class="card login-card">
        <div class="card-body p-4 p-sm-4">
            
            <!-- Brand / Logo Header Placeholder -->
            <div class="text-center mb-4">
                <div class="brand-logo-placeholder">
                    OF
                </div>
                <h1 class="h5 brand-title mb-1">Orderflow</h1>
                <p class="brand-subtitle mb-0">Beverage Distribution Management System</p>
            </div>

            <!-- Error Message Placeholder (Jinja2 Conditional Block) -->
            {% if error %}
            <div class="alert alert-custom-error mb-4" role="alert">
                {{ error }}
            </div>
            {% endif %}

            <!-- Login Form -->
            <form action="/setup" method="POST" novalidate>
                <!-- CSRF Token Placeholder -->
                {% if csrf_token %}
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                {% endif %}

                <!-- Username -->
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input 
                        type="text" 
                        class="form-control" 
                        id="username" 
                        name="username" 
                        placeholder="Enter your username" 
                        required 
                        autocomplete="username"
                    >
                </div>

                <!-- Password Field -->
                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="password" class="form-label mb-0">Password</label>
                    </div>
                    <input 
                        type="password" 
                        class="form-control" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password" 
                        required 
                        autocomplete="new-password"
                    >
                </div>

                <!-- Confirm Password Field -->
                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label for="confirm_password" class="form-label mb-0">Confirm Password</label>
                    </div>
                    <input 
                        type="password" 
                        class="form-control" 
                        id="confirm_password" 
                        name="confirm_password" 
                        placeholder="Confirm your password" 
                        required 
                        autocomplete="new-password"
                    >
                </div>

                <!-- Amber Login Button (Full Width, Dark Text) -->
                <button type="submit" class="btn btn-primary-accent w-100">
                    Setup user
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
